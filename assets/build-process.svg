<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-label="Build process: specify, model, architect, implement, test, iterate"><title>Build process: specify, model, architect, implement, test, iterate</title><defs>
