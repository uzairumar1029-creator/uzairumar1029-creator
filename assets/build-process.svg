</defs><line x1="30" x2="30" y1="30" y2="390" stroke="url(#gSurf)"/><linearGradient id="vl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6EE7FF"/><stop offset=".6" stop-color="#5B9CFF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient><rect x="29" y="30" width="2" height="360" fill="url(#vl)" opacity=".55"/><circle cx="30" cy="50" r="17" fill="#070A0F" stroke="#6EE7FF" stroke-width="1.4"/><text x="30" y="55" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#6EE7FF" text-anchor="middle" letter-spacing="1" >01</text><text x="66" y="48" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#F3F7FA" text-anchor="start" letter-spacing="3" >SPECIFY</text><text x="66" y="70" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B98A8" text-anchor="start" letter-spacing="0" >Define the problem.</text><circle cx="30" cy="114" r="17" fill="#070A0F" stroke="#6EE7FF" stroke-width="1.4"/><text x="30" y="119" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#6EE7FF" text-anchor="middle" letter-spacing="1" >02</text><text x="66" y="112" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#F3F7FA" text-anchor="start" letter-spacing="3" >MODEL</text><text x="66" y="134" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B98A8" text-anchor="start" letter-spacing="0" >Understand entities, data, boundaries and failure modes.</text><circle cx="30" cy="178" r="17" fill="#070A0F" stroke="#5B9CFF" stroke-width="1.4"/><text x="30" y="183" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#5B9CFF" text-anchor="middle" letter-spacing="1" >03</text><text x="66" y="176" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#F3F7FA" text-anchor="start" letter-spacing="3" >ARCHITECT</text><text x="66" y="198" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B98A8" text-anchor="start" letter-spacing="0" >Decide how components communicate.</text><circle cx="30" cy="242" r="17" fill="#070A0F" stroke="#5B9CFF" stroke-width="1.4"/><text x="30" y="247" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#5B9CFF" text-anchor="middle" letter-spacing="1" >04</text><text x="66" y="240" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#F3F7FA" text-anchor="start" letter-spacing="3" >IMPLEMENT</text><text x="66" y="262" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B98A8" text-anchor="start" letter-spacing="0" >Build explicit responsibilities and maintainable boundaries.</text><circle cx="30" cy="306" r="17" fill="#070A0F" stroke="#8B7CFF" stroke-width="1.4"/><text x="30" y="311" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#8B7CFF" text-anchor="middle" letter-spacing="1" >05</text><text x="66" y="304" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#F3F7FA" text-anchor="start" letter-spacing="3" >TEST</text><text x="66" y="326" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B98A8" text-anchor="start" letter-spacing="0" >Try to break assumptions.</text><circle cx="30" cy="370" r="17" fill="#070A0F" stroke="#8B7CFF" stroke-width="1.4"/><text x="30" y="375" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="12.5" font-weight="600" fill="#8B7CFF" text-anchor="middle" letter-spacing="1" >06</text><text x="66" y="368" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#F3F7FA" text-anchor="start" letter-spacing="3" >ITERATE</text><text x="66" y="390" font-family="Inter,'SF Pro Display','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#8B98A8" text-anchor="start" letter-spacing="0" >Keep what survives.</text></svg>
