<linearGradient id="gAd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6EE7FF"/><stop offset=".55" stop-color="#5B9CFF"/><stop offset="1" stop-color="#8B7CFF"/></linearGradient>
<linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B9CFF" stop-opacity=".7"/><stop offset="1" stop-color="#5B9CFF" stop-opacity="0"/></linearGradient>
<linearGradient id="gSurf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0D1118"/></linearGradient>
