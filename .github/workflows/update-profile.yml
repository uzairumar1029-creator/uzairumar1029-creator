name: Update profile (ESCAPE PROTOCOL + project index)

on:
  schedule:
    - cron: "17 3 * * *"      # daily, 03:17 UTC
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/**", "hosted/projects.json", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_USER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate ESCAPE PROTOCOL from the real contribution graph
        run: python scripts/escape_protocol.py
      - name: Build project index and hosted projects
        run: python scripts/build_projects.py
      - name: Commit changes
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -A assets projects hosted
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: regenerate profile assets"
          git push
